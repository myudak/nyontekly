<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Sticky notes</title><link rel="stylesheet" href="sticky.css"></head><body>
<div id="rail" hidden><button id="expand" title="Expand sticky notes">✎</button><div id="dots"></div></div>
<div id="app"><header><div><span class="badge">✳</span><strong>sticky notes</strong></div><div><button id="collapse" title="Collapse dock">↦</button><button id="close" title="Close dock">×</button></div></header>
<div id="list-view"><div class="controls"><input id="search" placeholder="Search notes" aria-label="Search notes"><button id="new" class="accent">＋</button></div><div class="filters"><button id="active" class="selected">Active</button><button id="archive">Archive</button><button id="export">Export</button></div><div id="list" class="list"></div><footer><select id="edge" aria-label="Dock edge"><option value="right">Right edge</option><option value="left">Left edge</option><option value="bottom">Bottom edge</option></select><select id="display" aria-label="Display"></select></footer><p class="hint">Ctrl/⌘ + N: new · Ctrl/⌘ + F: search</p></div>
<div id="editor" hidden><div class="editor-header"><button id="back">← Back</button><button id="remove">Delete</button></div><input id="title" maxlength="100" placeholder="Note title"><textarea id="body" maxlength="30000" placeholder="Write a note…"></textarea><div class="row"><select id="color" aria-label="Note color"><option value="yellow">Yellow</option><option value="green">Green</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="pink">Pink</option></select><button id="task">＋ Task</button><button id="bold" title="Wrap selection in Markdown bold">B</button><button id="italic" title="Wrap selection in Markdown italics">I</button></div><p class="hint">Markdown text: **bold**, *italic*, and [ ] tasks.</p><div class="row"><button id="toggle-archive">Archive</button><button id="save" class="accent">Save</button></div></div><p id="status" role="status"></p></div><script src="sticky.js"></script></body></html>
